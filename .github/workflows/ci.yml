name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · simulate · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # --- gameplay regression gates -------------------------------------
      # The simulation harness runs the real engine headlessly, so these catch
      # physics/AI regressions that a type checker never would.

      - name: Determinism (same inputs must produce byte-identical state)
        run: npm run sim:determinism

      - name: Frame data (every hitbox move must resolve)
        run: npm run sim:frames

      - name: Render smoke (all fighters × stages × visual states)
        run: npm run sim:render

      - name: Build
        run: npx next build

  balance:
    name: balance sweep (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A full round-robin is slow and inherently noisy, so it reports rather
    # than blocks. Look at it before shipping tuning changes.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Round-robin win-rate spread
        run: npm run sim:balance -- hard 2

      - name: AI difficulty ladder
        run: npm run sim:ladder -- normal 2
